services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: schema-mind

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - ./src:/app/src

    depends_on:
      postgres:
        condition: service_healthy

      mongodb:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:18-alpine

    container_name: schema-mind-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  mongodb:
    image: mongo:8

    container_name: schema-mind-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    ports:
      - "${MONGO_PORT}:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
