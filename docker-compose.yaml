services:
  app:
    build:
      context: .
      dockerfile: dockerfile

    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}

      DATABASE_DIALECT: ${DATABASE_DIALECT:-postgresql}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      MONGO_URI: ${MONGO_URI}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    depends_on:
      mongodb:
        condition: service_healthy

    volumes:
      - ./src:/app/src

  mongodb:
    image: mongodb/mongodb-atlas-local:7.0.12
    hostname: mongodb

    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin}

    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"

    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - mongodb_mongot:/data/mongot

  postgres:
    profiles:
      - postgresql

    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${DB_NAME:-schema_mind}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    profiles:
      - mysql

    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      MYSQL_DATABASE: ${DB_NAME:-schema-mind-db}
      MYSQL_USER: ${DB_USER:-schema_mind}
      MYSQL_PASSWORD: ${DB_PASSWORD:-schema_mind}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
  mongodb_config:
  mongodb_mongot:
  postgres_data:
  mysql_data:
